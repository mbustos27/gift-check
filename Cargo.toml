[workspace]
resolver = "2"
members = ["crates/core", "crates/fetch", "crates/ui", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tiny_http = "0.12.0"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
strip = true
