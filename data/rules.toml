# gift-check rules. Facts about stores live here, not in the code. Every rule has a `source` and
# an `as_of` date; "TODO" means not confirmed yet (the window shows how many are left).
#
# Most Pandora facts below come from the research report
#   ~/.claude/gift-scout/research/2026-11-15-pandora-buying-guide.md   (cited as "guide §N")
# which read Pandora's own pages through search-engine snippets (pandora.net answers 403 to
# plain fetches). Confidence marks from the report are kept: [official], [retailer], [3rd].
#
# Matching: `name_words` etc. match whole words, ignoring case; a trailing s/es on the product's
# word still counts. `id_prefix` matches the start of the product id; `?` is any one character.
# Kind and system rules: store-specific rules are tried before `store = "*"` ones, in file order,
# and the first match wins. A kind the store's own data states always wins over these rules.
# Edit this file and the products are re-classified the next time gift-check starts.

[meta]
version = 1
about = "Kinds, metals, compatibility systems, sizing and policies for gift-check."

